apiVersion: apps/v1
kind: Deployment
metadata:
  name: springmvcsearch
  namespace: springmvc
  labels:
    app: springmvcsearch

spec:
  replicas: 2

  selector:
    matchLabels:
      app: springmvcsearch

  template:
    metadata:
      labels:
        app: springmvcsearch

    spec:
      containers:
      - name: springmvcsearch

        image: anandhissal1/springmvcsearch:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 8080

        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        readinessProbe:
          httpGet:
            path: /home
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /home
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 20
